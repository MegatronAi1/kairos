[project]
name = "kairos-backend"
version = "0.1.0"
description = "Kairos backend: replay, inference pipeline, WebSocket, Claude agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kairos-ml",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "structlog>=24.1",
    "orjson>=3.10",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
