[project]
name = "kairos-ml"
version = "0.1.0"
description = "Kairos science and ML engines: yield, faults, explainability, energy"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
    "mapie>=0.8,<1",
    "optuna>=3.6",
    "scipy>=1.13",
    "joblib>=1.4",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos_ml"]
