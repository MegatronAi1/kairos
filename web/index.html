<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (no flash). Dark is the default.
      // ?theme=light|dark|system overrides and is remembered (handy for deck screenshots).
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "light" || q === "dark" || q === "system") localStorage.setItem("kairos.theme", q);
        var p = localStorage.getItem("kairos.theme") || "dark";
        if (p === "system") p = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = p;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Kairos Control Room</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232DD4BF' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%232DD4BF'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
