<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (no flash). Dark is the default.
      // ?theme=light|dark|system overrides and is remembered (handy for deck screenshots).
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "light" || q === "dark" || q === "system") localStorage.setItem("kairos.theme", q);
        var p = localStorage.getItem("kairos.theme") || "dark";
        if (p === "system") p = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = p;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Kairos Control Room</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0E13" />
    <meta name="description" content="Kairos: AI co-pilot for alternative-protein fermentation. Early yield forecasts, trustworthy alarms, energy-saving setpoints." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
